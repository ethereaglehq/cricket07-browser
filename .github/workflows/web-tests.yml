# Runs tests/web on every push: the page (launcher, saves, patches, online play) in headless Chromium
# against the stand-in engine, with the room server from server/ running locally. No game files needed.
name: Web tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read   # the tests only read the code

jobs:
  web:
    runs-on: ubuntu-24.04   # Playwright 1.56 has no Chromium build for newer Ubuntu
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4, pinned to its commit
        with:
          persist-credentials: false   # no token left in .git/config for the steps below

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4, pinned to its commit
        with:
          node-version: 22

      - name: VM script's firewall rules (tests/deploy)
        run: bash tests/deploy/firewall.sh

      # wrangler exactly as the test VM gets it (deploy/vm/tools: the lockfile's packages, checked against its
      # hashes, no install scripts run); Playwright at an exact version (its one dependency is pinned exactly)
      - name: Playwright with its Chromium, and wrangler for the room server
        timeout-minutes: 10
        run: |
          npm ci --ignore-scripts --no-fund --no-audit --prefix deploy/vm/tools
          npm i -g --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Tests
        env:
          WRANGLER_SEND_METRICS: "false"
        run: WRANGLER="$PWD/deploy/vm/tools/node_modules/.bin/wrangler" NODE_PATH="$(npm root -g)" node --expose-gc tests/web/run.js

      # the desktop app (desktop/app) in Electron on Linux, with the stand-in engine (the Desktop app workflow
      # builds and tests the Mac app itself)
      - name: Electron, for the desktop app's tests
        run: |
          curl -fsSL -o electron.zip https://github.com/electron/electron/releases/download/v44.7.0/electron-v44.7.0-linux-x64.zip
          echo "3ae7d5bdad61c664486c6ab61361dd084d064c8c08af8d13a687096e18ce555a  electron.zip" | sha256sum -c -
          unzip -q electron.zip -d electron

      - name: Desktop app tests
        env:
          WRANGLER_SEND_METRICS: "false"
          ELECTRON_ARGS: --no-sandbox   # Ubuntu 24.04 keeps Chromium's sandbox from starting on CI machines
        run: |
          ELECTRON="$PWD/electron/electron" WRANGLER="$PWD/deploy/vm/tools/node_modules/.bin/wrangler" \
            NODE_PATH="$(npm root -g)" xvfb-run -a node tests/desktop/run.js
