# Runs tests/web on every push: the page (launcher, saves, patches, online play) in headless Chromium
# against the stand-in engine, with the room server from server/ running locally. No game files needed.
name: Web tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-24.04   # Playwright 1.56 has no Chromium build for newer Ubuntu
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4, pinned to its commit

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4, pinned to its commit
        with:
          node-version: 22

      - name: Playwright with its Chromium, and wrangler for the room server
        run: |
          npm i -g playwright@1.56.1 wrangler@4.151.3
          npx playwright install --with-deps chromium

      - name: Tests
        run: WRANGLER="$(command -v wrangler)" NODE_PATH="$(npm root -g)" node --expose-gc tests/web/run.js
